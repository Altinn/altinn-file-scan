name: Auto Assign to Project
permissions:
  contents: read
  issues: write

on:
  issues:
    types:
      - opened

jobs:
  add-to-project:
    name: Add issue to Team altinn studio project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          project-url: https://github.com/orgs/Altinn/projects/164
          github-token: ${{ secrets.ASSIGN_PROJECT_TOKEN }}
