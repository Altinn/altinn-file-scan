name: Use Case - PROD
permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
  - cron: '*/15 * * * *'

jobs:
  PROD:
    environment: PROD
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Run use case tests
      run:  |
              cd test/k6
              docker compose run k6 run /src/tests/end2end.js -e subskey=${{ secrets.APIM_SUBSKEY }} -e env=${{ vars.ENV }} -e org=${{ vars.ORG }} -e app=${{ vars.APP }} -e userId=${{ secrets.USER_ID }} -e personNumber=${{ secrets.PERSON_NUMBER }} -e partyId=${{ secrets.PARTY_ID }} -e pid=${{ secrets.TESTIDP_TENOR_PID }} -e testidppwd=${{ secrets.TESTIDP_PASSWORD }}

  report-status:
    name: Report status
    runs-on: ubuntu-latest
    needs: [PROD]
    if: always() && contains(join(needs.*.result, ','), 'failure')
    steps:
      - name: Build failure report
        run: |
          report=" :warning: FileScan use case test failure in production :warning: \n"
          report+="Workflow available here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "stepreport="$report >> $GITHUB_ENV
      - name: Report failure to Slack
        id: slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_PROD }}
          payload: |
              {
                "text": "${{ env.stepreport }}"
              }

